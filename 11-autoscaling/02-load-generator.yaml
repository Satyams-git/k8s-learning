apiVersion: v1
kind: Namespace
metadata:
  name: load-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: load-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: load
        image: busybox:1.36
        command: ["sh", "-c", "while true; do wget -q -O- http://notes-svc.notes-ns.svc.cluster.local:82 > /dev/null; done"]
