apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: notes-vpa
  namespace: notes-ns
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notes-app
  updatePolicy:
    updateMode: "Recreate"     # Off | Initial | Recreate | InPlaceOrRecreate ("Auto" is deprecated)
  resourcePolicy:
    containerPolicies:
    - containerName: "*"
      minAllowed:
        cpu: 50m
        memory: 64Mi
      maxAllowed:
        cpu: "1"
        memory: 512Mi
      controlledResources: ["cpu", "memory"]
