# Kind cluster: 1 control-plane + 2 workers.
# extraPortMappings expose NodePorts 30080/30081 on the host (EC2) so a browser can reach them.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30081
        hostPort: 30081
        protocol: TCP
  - role: worker
  - role: worker
