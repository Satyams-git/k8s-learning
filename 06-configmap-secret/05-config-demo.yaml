# Two ways to consume a ConfigMap: all keys as env vars (envFrom) and as a file (volume)
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: mysql
data:
  APP_ENV: production
  LOG_LEVEL: info
  app.properties: |
    server.port=8080
    feature.dark-mode=true
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
  namespace: mysql
spec:
  containers:
  - name: demo
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    envFrom:
    - configMapRef:
        name: app-config
    volumeMounts:
    - name: config-vol
      mountPath: /etc/config
  volumes:
  - name: config-vol
    configMap:
      name: app-config
      items:
      - key: app.properties
        path: app.properties
