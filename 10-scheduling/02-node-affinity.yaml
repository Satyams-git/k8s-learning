# Required (hard) affinity: ONLY on ssd nodes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ssd
  namespace: sched-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-ssd
  template:
    metadata:
      labels:
        app: web-ssd
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: disktype
                operator: In
                values:
                - ssd
      containers:
      - name: nginx
        image: nginx:1.27
---
# Preferred (soft) affinity: try hdd nodes, but run anywhere if needed
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-prefer
  namespace: sched-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-prefer
  template:
    metadata:
      labels:
        app: web-prefer
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
              - key: disktype
                operator: In
                values:
                - hdd
      containers:
      - name: nginx
        image: nginx:1.27
