# Tolerates maintenance=true:NoExecute for 60 seconds, then gets evicted
apiVersion: v1
kind: Pod
metadata:
  name: patient-pod
  namespace: sched-ns
spec:
  tolerations:
  - key: maintenance
    operator: Equal
    value: "true"
    effect: NoExecute
    tolerationSeconds: 60
  containers:
  - name: nginx
    image: nginx:1.27
