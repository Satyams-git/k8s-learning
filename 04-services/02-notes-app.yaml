# Notes App (PHP + Apache on port 80) exposed with a NodePort.
# This file is reused in Modules 11 and 12.
apiVersion: v1
kind: Namespace
metadata:
  name: notes-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  namespace: notes-ns
  labels:
    app: notes-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      containers:
      - name: notes-app
        image: satyamsri/notes-app:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        volumeMounts:
        - name: notes-temp
          mountPath: /data
      volumes:
      - name: notes-temp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notes-svc
  namespace: notes-ns
spec:
  type: NodePort
  selector:
    app: notes-app
  ports:
  - protocol: TCP
    port: 82
    targetPort: 80
    nodePort: 30080
